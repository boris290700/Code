<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITGC Tester</title>
<style>/* style.css - look of the app. Colours and sizes are defined once at the top (":root") and reused. */
:root{
  --bg:#f3f5f9;--panel:#fff;--ink:#172033;--muted:#5b6578;--line:#e3e7ee;--line2:#d3d9e3;
  --brand:#24479b;--brand-600:#1c3a82;--brand-50:#eef3fc;--brand-100:#dce6f8;
  --side:#0f1d36;--side-2:#16284a;--side-ink:#c3cee3;--side-muted:#8392ad;
  --exc:#b42318;--exc-bg:#fdeceb;--rev:#a15c00;--rev-bg:#fff3dc;--pass:#15803d;--pass-bg:#e7f6ec;--info:#2e5aa8;--info-bg:#eaf1fc;
  --nt:#7a5c00;--nt-bg:#fff2cc;
  --radius:12px;--shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);--shadow-lg:0 12px 32px rgba(16,24,40,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:14.5px/1.5 "Segoe UI",-apple-system,system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
.ico{display:inline-flex;width:18px;height:18px;flex:none;vertical-align:-3px}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:0 22px;height:58px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#3f6fd8);color:#fff;display:grid;place-items:center}
.logo .ico{width:20px;height:20px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.1px}
header .sub{color:var(--muted);font-size:12.5px}
header .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--pass);background:var(--pass-bg);padding:5px 10px;border-radius:20px;font-weight:600}
.badge .ico{width:14px;height:14px}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:8px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.hbtn:hover{background:var(--brand-50);border-color:var(--brand-100)}
#ver{font-size:12px;color:var(--muted)}

/* ---------- layout and step navigation ---------- */
.layout{display:flex;min-height:calc(100vh - 58px)}
nav{width:262px;flex:none;background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
nav .navhead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:0 10px 10px}
nav .navprog{height:4px;background:var(--side-2);border-radius:4px;margin:0 10px 14px;overflow:hidden}
nav .navprog div{height:100%;background:#4f86f7;border-radius:4px;transition:width .3s}
nav button{position:relative;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:9px 10px;font:inherit;color:var(--side-ink);cursor:pointer;border-radius:10px;margin-bottom:2px}
nav button:hover{background:var(--side-2)}
nav button .n{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid #34466b;color:var(--side-ink);font-size:13px;font-weight:700;background:var(--side)}
nav button .n .ico{width:14px;height:14px}
nav button .tx b{display:block;font-weight:600;font-size:14px;color:#e8eefb}
nav button .tx span{display:block;font-size:12px;color:var(--side-muted);line-height:1.35;margin-top:1px}
nav button.active{background:#1d3561}
nav button.active .n{background:#4f86f7;border-color:#4f86f7;color:#fff}
nav button.done .n{background:#1f9d55;border-color:#1f9d55;color:#fff}
nav button:not(:last-of-type)::after{content:"";position:absolute;left:23px;top:40px;width:2px;height:calc(100% - 30px);background:#26385c}
nav .scope{margin:16px 6px 0;padding:12px;border-radius:10px;background:var(--side-2);font-size:12.5px;color:var(--side-ink)}
nav .scope b{color:#fff;display:block;margin-bottom:6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
nav .scope .pill{display:inline-block;background:#28406e;color:#dbe6fb;border-radius:12px;padding:1px 8px;margin:0 4px 4px 0;font-weight:600}
main{flex:1;padding:26px 34px 110px;max-width:1240px;min-width:0}

/* ---------- page heading and help ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
h2{margin:4px 0 6px;font-size:26px;letter-spacing:-.2px}
.lead{color:var(--muted);margin:0 0 18px;max-width:860px;font-size:15px}
.help{background:linear-gradient(180deg,#f4f8ff,#eef3fc);border:1px solid var(--brand-100);border-radius:var(--radius);padding:2px 16px;margin-bottom:18px}
.help summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 0;font-weight:600;color:var(--brand-600)}
.help summary::-webkit-details-marker{display:none}
.help summary::after{content:"Show";margin-left:auto;font-size:12px;font-weight:600;color:var(--brand)}
.help[open] summary::after{content:"Hide"}
.help ol{margin:0 0 14px;padding-left:22px;color:#2b3550}
.help li{margin:4px 0}

/* ---------- cards, layout helpers ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border:1px solid var(--brand);border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.08);transition:background .15s,transform .05s}
.btn:hover{background:var(--brand-600)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:#fff;color:var(--brand);border-color:var(--line2)}
.btn.secondary:hover{background:var(--brand-50);border-color:var(--brand-100)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
.btn.ghost:hover{background:#e9edf4;color:var(--ink)}
.btn.big{padding:13px 22px;font-size:16px;border-radius:11px}
.btn.small{padding:5px 11px;font-size:12.5px}
.btn.green{background:#1f8a4c;border-color:#1f8a4c}.btn.green:hover{background:#18723e}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- action bar (Back / Next) ---------- */
.actionbar{position:fixed;left:262px;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 34px;display:flex;align-items:center;gap:12px}
.actionbar .hint{color:var(--muted);font-size:13px;margin-left:auto}
.actionbar .hint + .btn{margin-left:0}
.actionbar .spacer{margin-left:auto}

/* ---------- forms ---------- */
label{font-size:12.5px;color:#3d4760;display:block;margin-bottom:4px;font-weight:600}
input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:#fff;width:100%;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#6f95e6;box-shadow:0 0 0 3px rgba(79,134,247,.18)}
textarea{min-height:60px;resize:vertical}
.field{min-width:190px;flex:1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}

/* ---------- welcome / hero ---------- */
.hero{display:flex;gap:22px;align-items:center;background:linear-gradient(120deg,#1c3a82,#2f5fcf 60%,#4f86f7);color:#fff;border-radius:16px;padding:24px 28px;margin-bottom:20px;box-shadow:var(--shadow-lg)}
.hero h3{margin:0 0 6px;font-size:20px}
.hero p{margin:0;color:#dbe6ff;max-width:640px}
.hero .btn{background:#fff;color:var(--brand-600);border-color:#fff;margin-left:auto;white-space:nowrap}
.hero .btn:hover{background:#eef3fc}
.steps3{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:13px;color:#e6eeff}
.steps3 span b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);margin-right:6px;font-size:12px}

/* ---------- control picker ---------- */
.ctlpick{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-size:14px;color:var(--ink);background:#fff;transition:border-color .15s,box-shadow .15s,background .15s;margin:0;font-weight:400}
.ctlpick:hover{border-color:#b8c7e6}
.ctlpick.on{border-color:var(--brand);background:#f7f9ff;box-shadow:0 0 0 3px rgba(36,71,155,.08)}
.ctlpick input{margin-top:3px;width:18px;height:18px;accent-color:var(--brand);flex:none}
.ctlpick .ttl{font-weight:700;font-size:15px}
.ctlpick .area{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin:2px 0 6px}
.ctlpick .area .ico{width:14px;height:14px}
.ctlpick details{margin-top:6px}
.ctlpick details summary{font-size:12.5px}
.ev{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:10px;margin:0 4px 3px 0;font-weight:600}
.ev.req{background:var(--brand-50);color:var(--brand)}.ev.opt{background:#f0f2f5;color:var(--muted)}

/* ---------- upload ---------- */
.drop{border:2px dashed #b5c3dc;border-radius:14px;padding:30px;text-align:center;color:var(--muted);background:#f9fbff;transition:background .15s,border-color .15s}
.drop.over{border-color:var(--brand);background:var(--brand-50)}
.drop .big-ico{width:52px;height:52px;border-radius:50%;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;margin:0 auto 10px}
.drop .big-ico .ico{width:26px;height:26px}
.drop h4{margin:0 0 4px;color:var(--ink);font-size:16px}
.drop p{margin:0 0 14px}
.demo-line{margin:12px 0 0;text-align:center;font-size:13px;color:var(--muted)}

/* ---------- tables ---------- */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{background:#f6f8fb;font-weight:600;color:#3d4760;font-size:12.5px;position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfe}
.scroll{max-height:600px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tablewrap{border:1px solid var(--line);border-radius:10px;overflow:hidden}
td.ticks{white-space:nowrap}
tr.r-EXCEPTION td:first-child{box-shadow:inset 3px 0 0 var(--exc)}
tr.r-REVIEW td:first-child{box-shadow:inset 3px 0 0 #e0a106}
tr.r-PASS td:first-child{box-shadow:inset 3px 0 0 #9fd3b3}
td select{min-width:170px}
td textarea{min-height:38px;min-width:190px}

/* ---------- status chips and tickmarks ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.02em}
.chip .ico{width:12px;height:12px}
.EXCEPTION,.FAIL,.MISSING{background:var(--exc-bg);color:var(--exc)}
.REVIEW,.WARNING{background:var(--rev-bg);color:var(--rev)}
.PASS,.OK{background:var(--pass-bg);color:var(--pass)}
.INFO{background:var(--info-bg);color:var(--info)}
.NOTTESTED{background:var(--nt-bg);color:var(--nt)}.NA{background:#eef0f4;color:#5a6378}
.tick{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 4px;border-radius:6px;font-size:11.5px;font-weight:800;margin:0 8px 0 3px}
.tick.PASS{background:var(--pass-bg);color:var(--pass)}.tick.EXCEPTION{background:var(--exc-bg);color:var(--exc)}.tick.REVIEW{background:var(--rev-bg);color:var(--rev)}
.tick.NA{background:#f0f2f5;color:#8a93a3}.tick.NOTTESTED{background:var(--nt-bg);color:var(--nt)}
.attr{font-size:12.5px;margin:4px 0;display:flex;gap:4px;align-items:baseline}

/* ---------- messages, tips, toasts ---------- */
.msg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;margin:10px 0;border:1px solid transparent}
.msg .ico{margin-top:2px}
.msg.warn{background:var(--rev-bg);color:#6b4500;border-color:#f6dfae}
.msg.err{background:var(--exc-bg);color:var(--exc);border-color:#f6c9c4}
.msg.ok{background:var(--pass-bg);color:#11602f;border-color:#bfe5cd}
.msg.info{background:var(--info-bg);color:#1f3f7a;border-color:var(--brand-100)}
.msg ul{margin:6px 0 0 18px;padding:0}
.tip{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#e4e9f2;color:#4a5670;font-size:11px;font-weight:800;cursor:help;margin-left:5px;vertical-align:1px;position:relative}
.tip:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:270px;background:#172033;color:#fff;font-size:12.5px;font-weight:400;line-height:1.45;padding:9px 11px;border-radius:8px;box-shadow:var(--shadow-lg);z-index:50;text-align:left;white-space:normal;letter-spacing:0;text-transform:none}
#toasts{position:fixed;right:22px;bottom:84px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;gap:10px;align-items:center;background:#172033;color:#fff;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13.5px;animation:tin .25s ease-out}
.toast .ico{color:#6fdc9a}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
details summary{cursor:pointer;color:var(--brand);font-weight:600}

/* ---------- checklist / mapping ---------- */
.summary-banner{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:12px;margin-bottom:18px;border:1px solid}
.summary-banner .big-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.summary-banner .big-ico .ico{width:22px;height:22px}
.summary-banner h3{margin:0;font-size:16px}
.summary-banner p{margin:2px 0 0;font-size:13.5px}
.summary-banner.good{background:var(--pass-bg);border-color:#bfe5cd;color:#11602f}.summary-banner.good .big-ico{background:#c9ecd6}
.summary-banner.attn{background:var(--rev-bg);border-color:#f6dfae;color:#6b4500}.summary-banner.attn .big-ico{background:#fbe2b0}
.summary-banner.bad{background:var(--exc-bg);border-color:#f6c9c4;color:var(--exc)}.summary-banner.bad .big-ico{background:#f9cfca}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.mapbox{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:10px;background:#fff}
.mapbox > summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 0;color:var(--ink)}
.mapbox > summary::-webkit-details-marker{display:none}
.mapbox > summary .sheet{color:var(--muted);font-weight:400;font-size:13px}
.mapbox > summary .chip{margin-left:auto}
.mapbox[open] > summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.mapbox .inner{padding-bottom:12px}

/* ---------- results ---------- */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.stat .t{font-size:15px;font-weight:700;color:var(--ink)}
.stat .small{margin-top:2px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 10px}
.num{border-radius:10px;padding:10px 12px}
.num b{display:block;font-size:24px;line-height:1.1}
.num span{font-size:12px;font-weight:600}
.num.exc{background:var(--exc-bg);color:var(--exc)}.num.rev{background:var(--rev-bg);color:var(--rev)}.num.pass{background:var(--pass-bg);color:var(--pass)}
.bar{display:flex;height:8px;border-radius:6px;overflow:hidden;background:#eef0f4;margin-bottom:12px}
.bar i{display:block;height:100%}
.bar .b-exc{background:#d9483b}.bar .b-rev{background:#e8a317}.bar .b-pass{background:#3fb06e}
.attrs{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.attrs .a{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.attrs .a .chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.stat .btn{margin-top:12px}
.progress{height:8px;background:#e7ebf2;border-radius:6px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:linear-gradient(90deg,var(--brand),#4f86f7);width:0;transition:width .2s}
.runbox{display:flex;gap:20px;align-items:center}
.runbox .big-ico{width:56px;height:56px;border-radius:50%;background:var(--brand-50);color:var(--brand);display:grid;place-items:center;flex:none}
.runbox .big-ico .ico{width:26px;height:26px}
.runbox h3{font-size:18px}
.runbox .btn{margin-left:auto}
.reviewprog{display:flex;align-items:center;gap:16px}
.reviewprog .progress{flex:1;margin:0;height:10px}
.reviewprog .progress div{background:linear-gradient(90deg,#1f8a4c,#3fb06e)}
.exports{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- settings ---------- */
.ctl{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:#fbfcfe}
.ctl h4{margin:0 0 10px;font-size:14.5px;display:flex;align-items:center;gap:8px}

/* ---------- glossary dialog ---------- */
dialog{border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 40px);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(15,29,54,.45)}
dialog .dh{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
dialog .dh h3{margin:0;font-size:18px}
dialog .dh button{margin-left:auto}
dialog dl{margin:0;padding:8px 22px 20px;max-height:65vh;overflow:auto}
dialog dt{font-weight:700;margin-top:14px;color:var(--brand-600)}
dialog dd{margin:3px 0 0;color:#3a445c}
code{background:#eef1f5;padding:1px 5px;border-radius:4px;font-size:12.5px}

/* ---------- small screens ---------- */
@media (max-width:900px){
  .layout{flex-direction:column}
  nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;padding:8px}
  nav .navhead,nav .navprog,nav .scope,nav button .tx span{display:none}
  nav button{width:auto;flex:none;white-space:nowrap;align-items:center}
  nav button::after{display:none}
  main{padding:18px 16px 110px}
  .actionbar{left:0;padding:10px 16px}
  header .sub,.badge span{display:none}
  .hero{flex-direction:column;align-items:flex-start}.hero .btn{margin-left:0}
  .runbox{flex-direction:column;align-items:flex-start}.runbox .btn{margin-left:0}
}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo" id="logo"></div><div><h1>ITGC Tester</h1><div class="sub">Automated IT general controls testing</div></div></div>
  <div class="right"><span class="badge" id="privacy"></span><button class="hbtn" id="glossaryBtn" type="button"></button><span id="ver"></span></div>
</header>
<div class="layout"><nav></nav><main></main></div>
<div id="toasts"></div>
<dialog id="glossary"></dialog>
<script>/* xlsx.js - minimal, dependency-free Excel (.xlsx) and CSV reader/writer.
   Reading uses the built-in DecompressionStream; writing uses an uncompressed ZIP.
   Works in modern Chrome, Edge, Firefox, Safari and Node 18+.

   Reading is tolerant of real-world exports: report titles above the header,
   footer/total lines, repeated header lines (page breaks), blank rows,
   duplicate column names, tab/semicolon/comma/pipe delimiters, UTF-8/UTF-16. */
// HOW TO READ THIS FILE (for non-programmers)
// This file reads and writes spreadsheet files, so the tool needs no external software.
//   Reading: an .xlsx file is really a ZIP archive containing XML text files (one per sheet,
//   plus a shared list of all texts and a list of cell formats). The code unzips it, reads
//   the cells, finds the header row and turns every row into a record such as
//   { "User Name": "IVITOLA", "Created On": "06.04.2025", ... }.
//   CSV / text exports are read the same way after detecting the delimiter and encoding.
//   Writing: builds the XML files of a new workbook (cells, styles, merged cells, dropdowns,
//   formulas) and zips them into an .xlsx file – this is how the workpaper is produced.
const XLSX_LITE = (() => {
  const dec = new TextDecoder();
  const enc = new TextEncoder();

  // ---------- ZIP reading ----------
  // Unpacks one compressed file inside the ZIP, using the browser's built-in decompression.
  async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  // Reads the table of contents at the end of the ZIP file and returns a helper that can give
  // the text of any file inside it (e.g. "xl/worksheets/sheet1.xml").
  async function unzip(buf) {
    const b = new Uint8Array(buf), v = new DataView(b.buffer, b.byteOffset, b.byteLength);
    let eocd = -1;
    for (let i = b.length - 22; i >= Math.max(0, b.length - 66000); i--) if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('Not a valid .xlsx file (ZIP directory not found). Old .xls files are not supported – open the file in Excel and save it as .xlsx or .csv.');
    const n = v.getUint16(eocd + 10, true); let p = v.getUint32(eocd + 16, true);
    const files = {};
    for (let k = 0; k < n; k++) {
      if (v.getUint32(p, true) !== 0x02014b50) throw new Error('Corrupt ZIP directory.');
      const method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true);
      const nlen = v.getUint16(p + 28, true), xlen = v.getUint16(p + 30, true), clen = v.getUint16(p + 32, true);
      const lho = v.getUint32(p + 42, true);
      const name = dec.decode(b.subarray(p + 46, p + 46 + nlen));
      const lnlen = v.getUint16(lho + 26, true), lxlen = v.getUint16(lho + 28, true);
      const start = lho + 30 + lnlen + lxlen, data = b.subarray(start, start + csize);
      files[name] = { method, data };
      p += 46 + nlen + xlen + clen;
    }
    return {
      async text(name) {
        const f = files[name] || files[Object.keys(files).find(k => k.toLowerCase() === name.toLowerCase())];
        if (!f) return null;
        const raw = f.method === 0 ? f.data : await inflateRaw(f.data);
        return dec.decode(raw);
      },
      names: Object.keys(files),
    };
  }

  // ---------- XML helpers (regex based; sufficient for SpreadsheetML) ----------
  // Small helpers for the XML inside .xlsx files: "ent" turns codes like &amp; back into &,
  // "attr" reads a property of an XML tag, "colIndex" turns a column letter (A, B, ... AA) into a number.
  const ent = s => s.replace(/&(lt|gt|amp|quot|apos|#\d+|#x[0-9a-f]+);/gi, (m, e) => ({ lt: '<', gt: '>', amp: '&', quot: '"', apos: "'" })[e.toLowerCase()] ?? (e[1].toLowerCase() === 'x' ? String.fromCodePoint(parseInt(e.slice(2), 16)) : String.fromCodePoint(parseInt(e.slice(1), 10))));
  const attr = (tag, a) => { const m = tag.match(new RegExp('\\s' + a + '="([^"]*)"')); return m ? ent(m[1]) : null; };
  const colIndex = ref => { let c = 0; for (const ch of ref.replace(/\d+/g, '')) c = c * 26 + (ch.charCodeAt(0) - 64); return c - 1; };

  // Reads all sheets of an .xlsx workbook. Steps: list the sheets, read the shared texts,
  // find which cell formats are dates (Excel stores dates as numbers with a date format),
  // then read every row and cell of every sheet.
  async function readXlsx(buf) {
    const z = await unzip(buf);
    const wb = await z.text('xl/workbook.xml');
    if (!wb) throw new Error('Not an Excel workbook (xl/workbook.xml missing).');
    const rels = (await z.text('xl/_rels/workbook.xml.rels')) || '';
    const relMap = {};
    for (const m of rels.matchAll(/<Relationship\b[^>]*>/g)) relMap[attr(m[0], 'Id')] = attr(m[0], 'Target');
    const ssXml = (await z.text('xl/sharedStrings.xml')) || '';
    // Excel stores each distinct text once in a shared list; cells refer to it by number.
    const shared = [...ssXml.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m => [...m[1].matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)].map(t => ent(t[1])).join(''));
    // date styles: numFmtIds 14-22, 45-47 or custom formats containing d/m/y/h
    const stXml = (await z.text('xl/styles.xml')) || '';
    // Which cell styles are date formats – so that a number like 45657 is shown as 2024-12-31.
    const customDate = new Set();
    for (const m of stXml.matchAll(/<numFmt\b[^>]*>/g)) { const code = (attr(m[0], 'formatCode') || '').replace(/\[[^\]]*\]|"[^"]*"/g, ''); if (/[dmyh]/i.test(code)) customDate.add(+attr(m[0], 'numFmtId')); }
    const xfs = (stXml.match(/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/) || [, ''])[1];
    const dateStyle = [...xfs.matchAll(/<xf\b[^>]*\/?>/g)].map(m => { const id = +attr(m[0], 'numFmtId'); return (id >= 14 && id <= 22) || (id >= 45 && id <= 47) || customDate.has(id); });
    const sheets = {};
    for (const m of wb.matchAll(/<sheet\b[^>]*\/?>/g)) {
      const name = attr(m[0], 'name'); let target = relMap[attr(m[0], 'r:id')] || '';
      target = target.replace(/^\/?xl\//, '').replace(/^\//, '');
      const xml = await z.text('xl/' + target);
      if (!xml) continue;
      const rows = [];
      for (const r of xml.matchAll(/<row\b([^>]*)>([\s\S]*?)<\/row>|<row\b([^>]*)\/>/g)) {
        const rn = +(attr('<row ' + (r[1] || r[3] || ''), 'r') || rows.length + 1);
        // Keep the real Excel row numbers (empty rows are not stored in the file), so evidence can be traced to its row.
        while (rows.length < rn - 1) rows.push([]); // keep real Excel row numbers
        const row = [];
        for (const c of (r[2] || '').matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
          const tag = '<c ' + c[1], ref = attr(tag, 'r'), t = attr(tag, 't'), s = +(attr(tag, 's') || 0);
          const inner = c[2] || '', vm = inner.match(/<v>([\s\S]*?)<\/v>/);
          let val = null;
          // Read the cell value according to its type: shared text, inline text, true/false, formula text, or number/date.
          if (t === 's') val = vm ? shared[+vm[1]] : null;
          else if (t === 'inlineStr') val = [...inner.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)].map(x => ent(x[1])).join('');
          else if (t === 'b') val = vm ? vm[1] === '1' : null;
          else if (t === 'str' || t === 'e') val = vm ? ent(vm[1]) : null;
          else if (vm) { const num = Number(vm[1]); val = dateStyle[s] ? excelDate(num) : num; }
          const ci = ref ? colIndex(ref) : row.length;
          row[ci] = val;
        }
        rows.push(row);
      }
      sheets[name] = toObjects(rows);
    }
    return sheets;
  }
  // Converts an Excel date number (days since 1900) into a readable date such as 2025-12-31.
  function excelDate(serial) { // returns ISO string; keeps time when fractional
    const ms = Math.round((serial - 25569) * 86400000);
    const d = new Date(ms), iso = d.toISOString();
    return serial % 1 === 0 ? iso.slice(0, 10) : iso.slice(0, 19).replace('T', ' ');
  }

  // ---------- From a grid of cells to records ----------
  // FROM A GRID OF CELLS TO RECORDS.
  // "empty" = cell has no content. FOOTER = text that typically starts a total or footer line in
  // report exports ("Total", "Number of records:", "Page 2", "End of report"...).
  const empty = x => x === null || x === undefined || (typeof x === 'string' && x.trim() === '');
  const FOOTER = /^\s*(total|totals|grand total|sum|count|number of (rows|records|entries)|\d+\s+(rows|records|entries|lines)|records?:|rows?:|end of (report|list)|report (generated|run|printed)|generated (by|on)|page \d+|\*{3,})/i;
  // Header = the row (within the first 30) with the most short text cells that is followed by data.
  // Finds the header row: real exports often start with report titles and filter descriptions.
  // Within the first 30 rows, the header is the row with the most short text cells (no numbers,
  // no dates) that is followed by data rows.
  function findHeader(rows) {
    let best = -1, bestScore = 0;
    for (let i = 0; i < Math.min(rows.length, 30); i++) {
      const vals = (rows[i] || []).filter(x => !empty(x));
      if (vals.length < 2) continue;
      const texts = vals.filter(x => typeof x === 'string' && x.trim().length <= 60 && !/^[-+]?\d+([.,]\d+)?$/.test(x.trim()) && !/^\d{1,4}[-./]\d{1,2}[-./]\d{1,4}/.test(x.trim()));
      if (texts.length < vals.length * 0.8) continue;
      const next = rows.slice(i + 1, i + 6).filter(r => r && r.some(x => !empty(x)));
      if (!next.length) continue;
      if (texts.length > bestScore) { best = i; bestScore = texts.length; }
    }
    return best >= 0 ? best : rows.findIndex(r => r && r.some(x => !empty(x)));
  }
  // rows: array of arrays. headerIndex: optional 0-based override.
  // Turns the rows below the header into records. Along the way it:
  //   - skips blank lines,
  //   - drops repeated header lines (page breaks in printed reports),
  //   - drops footer / total lines,
  //   - notes values that sit in columns without a header (sign of a shifted extract),
  //   - renames duplicate column names ("Status", "Status (2)").
  // Everything dropped or noticed is written into "meta" so the data checks and the C&A sheet
  // can show the auditor exactly what was excluded and why. headerIndex lets the auditor
  // override the detected header row in step 3.
  function toObjects(rows, headerIndex) {
    const hi = headerIndex ?? findHeader(rows);
    const out = [];
    const meta = { headerRow: hi + 1, rowNumbers: [], excluded: [], columns: [], titleLines: [], raw: rows };
    if (hi < 0 || !rows[hi]) { Object.defineProperty(out, 'meta', { value: meta, enumerable: false }); return out; }
    // Remember the title lines above the header (shown on the C&A sheet).
    meta.titleLines = rows.slice(0, hi).map(r => (r || []).filter(x => !empty(x)).join(' ')).filter(Boolean);
    // Column names; empty ones become COLUMN_1, COLUMN_2..., duplicates get a number.
    const seen = {};
    const head = rows[hi].map((h, i) => {
      let n = empty(h) ? 'COLUMN_' + (i + 1) : String(h).replace(/\s+/g, ' ').trim();
      if (seen[n.toUpperCase()]) n = `${n} (${++seen[n.toUpperCase()]})`; else seen[n.toUpperCase()] = 1;
      return n;
    });
    meta.columns = head;
    const headKey = head.map(h => h.toUpperCase()).join('|');
    const filledHead = head.filter((h, i) => !empty(rows[hi][i])).length;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const vals = row.filter(x => !empty(x));
      // Go through every row below the header and decide whether it is a real record.
      if (!vals.length) continue; // blank line
      if (row.map(x => empty(x) ? '' : String(x).replace(/\s+/g, ' ').trim().toUpperCase()).join('|') === headKey) { meta.excluded.push({ row: r + 1, reason: 'Repeated header line (page break)', text: vals.join(' ') }); continue; }
      if (filledHead >= 3 && vals.length <= 2 && FOOTER.test(String(vals[0]))) { meta.excluded.push({ row: r + 1, reason: 'Footer / total line', text: vals.join(' ') }); continue; }
      if (row.length > head.length && row.slice(head.length).some(x => !empty(x))) meta.excluded.push({ row: r + 1, reason: 'Values outside the header columns ignored', text: row.slice(head.length).filter(x => !empty(x)).join(' '), kept: true });
      out.push(Object.fromEntries(head.map((h, i) => [h, row[i] === undefined || (typeof row[i] === 'string' && row[i].trim() === '') ? null : row[i]])));
      meta.rowNumbers.push(r + 1);
    }
    Object.defineProperty(out, 'meta', { value: meta, enumerable: false });
    return out;
  }

  // ---------- CSV / text ----------
  // Text files can be stored in different encodings. SAP GUI often saves "unconverted" exports in
  // UTF-16 (two bytes per letter); Excel CSVs may be UTF-8 or Windows-1252. This detects which one
  // it is, so that letters like ā, ē, ü are read correctly.
  function decodeText(buf) {
    const b = new Uint8Array(buf);
    if (b[0] === 0xff && b[1] === 0xfe) return new TextDecoder('utf-16le').decode(b.subarray(2));
    if (b[0] === 0xfe && b[1] === 0xff) return new TextDecoder('utf-16be').decode(b.subarray(2));
    // UTF-16 without BOM: many zero bytes in odd positions
    let z = 0; for (let i = 1; i < Math.min(b.length, 400); i += 2) if (b[i] === 0) z++;
    if (b.length > 4 && z > Math.min(b.length, 400) / 4) return new TextDecoder('utf-16le').decode(b);
    const t = dec.decode(b);
    if (t.includes('�')) { try { return new TextDecoder('windows-1252').decode(b); } catch { return t; } }
    return t;
  }
  // Reads a CSV or text export. The delimiter (tab, semicolon, comma or pipe) is detected by
  // looking at which one appears the same number of times on most of the first lines.
  // Then the text is split into cells, respecting quotes ("a; b" stays one cell).
  function readCsv(text) {
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
    // delimiter = the candidate that appears most consistently in the first lines
    const lines = text.split(/\r?\n/).filter(l => l.trim()).slice(0, 25);
    let delim = ',', best = -1;
    for (const d of ['\t', ';', ',', '|']) {
      const counts = lines.map(l => l.split(d).length - 1).filter(n => n > 0);
      if (!counts.length) continue;
      const mode = counts.sort((a, b) => counts.filter(x => x === b).length - counts.filter(x => x === a).length)[0];
      const score = counts.filter(n => n === mode).length * 100 + mode;
      if (score > best) { best = score; delim = d; }
    }
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"' && cell.trim() === '') { q = true; cell = ''; }
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    // SAP list output wraps columns in | and draws ---- lines
    // SAP list output draws lines of dashes and wraps columns in | – remove those decorations.
    const clean = rows.filter(r => !(r.length <= 2 && /^[-=_\s|]+$/.test(r.join(''))))
      .map(r => (delim === '|' && r.length > 2 && r[0].trim() === '' && r[r.length - 1].trim() === '' ? r.slice(1, -1) : r).map(x => x.trim() === '' ? null : x.trim()));
    return toObjects(clean);
  }

  // ---------- ZIP + XLSX writing ----------
  // WRITING .XLSX FILES.
  // crc32 = a checksum the ZIP format requires for every file; zip = packs the files together
  // (without compression, which keeps the code simple and Excel accepts it).
  const crcTable = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = crcTable[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
  // Builds the ZIP archive byte by byte: a header per file, then a table of contents at the end.
  function zip(files) { // files: [{name, data:Uint8Array}] - stored (no compression)
    const parts = [], central = []; let offset = 0;
    for (const f of files) {
      const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true); h.setUint16(26, nm.length, true);
      parts.push(new Uint8Array(h.buffer), nm, f.data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true); c.setUint16(28, nm.length, true); c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), nm);
      offset += 30 + nm.length + sz;
    }
    const csize = central.reduce((a, x) => a + x.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, offset, true);
    const all = [...parts, ...central, new Uint8Array(e.buffer)];
    const out = new Uint8Array(all.reduce((a, x) => a + x.length, 0)); let p = 0; for (const x of all) { out.set(x, p); p += x.length; }
    return out;
  }
  // esc = makes text safe inside XML (e.g. & becomes &amp;); colName = column number to letters (0 → A, 27 → AB).
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
  const colName = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

  // The visual styles available for workpaper cells: fonts, fill colours and borders.
  // Each style has a name used by the workpaper code, e.g. 'th' = dark blue table header,
  // 'input' = yellow cell for the auditor to fill in, 'pass' / 'exc' / 'rev' = green / red / amber
  // result cells, 'date' = date format.
  // Named cell styles for workpapers. Order = index in cellXfs.
  // [name, fontId, fillId, borderId, numFmtId, alignment]
  const FONTS = ['<font><sz val="10"/><name val="Arial"/></font>', '<font><b/><sz val="10"/><name val="Arial"/></font>', '<font><b/><sz val="14"/><color rgb="FF1F4E79"/><name val="Arial"/></font>', '<font><b/><sz val="11"/><color rgb="FF1F4E79"/><name val="Arial"/></font>', '<font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font>', '<font><i/><sz val="9"/><color rgb="FF5D6779"/><name val="Arial"/></font>', '<font><b/><sz val="10"/><color rgb="FF1E7A46"/><name val="Arial"/></font>', '<font><b/><sz val="10"/><color rgb="FFB42318"/><name val="Arial"/></font>', '<font><b/><sz val="10"/><color rgb="FF9A6200"/><name val="Arial"/></font>'];
  const FILLS = ['none', 'gray125', 'FFDDE4EC', 'FFFFF2CC', 'FF1F4E79', 'FFE6F4EC', 'FFFDECEA', 'FFFFF4DC', 'FFEDEDED', 'FFF2F2F2'];
  const W = '<alignment wrapText="1" vertical="top"/>', WC = '<alignment wrapText="1" vertical="top" horizontal="center"/>';
  const STYLES = [
    ['default', 0, 0, 0, 0, ''], ['hdr', 1, 2, 0, 0, ''], ['wrap', 0, 0, 0, 0, W],
    ['title', 2, 0, 0, 0, ''], ['h2', 3, 2, 0, 0, '<alignment vertical="center"/>'], ['label', 1, 9, 1, 0, W], ['text', 0, 0, 1, 0, W],
    ['input', 0, 3, 1, 0, W], ['th', 4, 4, 1, 0, WC], ['pass', 6, 5, 1, 0, WC], ['exc', 7, 6, 1, 0, WC], ['rev', 8, 7, 1, 0, WC],
    ['nt', 1, 8, 1, 0, WC], ['note', 5, 0, 0, 0, W], ['num', 0, 0, 1, 1, '<alignment vertical="top"/>'], ['bold', 1, 0, 1, 0, W],
    ['pct', 0, 0, 1, 10, '<alignment vertical="top"/>'], ['center', 0, 0, 1, 0, WC], ['date', 0, 0, 1, 14, '<alignment vertical="top" horizontal="left"/>'],
    ['datetime', 0, 0, 1, 22, '<alignment vertical="top" horizontal="left"/>'], ['plain', 0, 0, 0, 0, ''], ['boldplain', 1, 0, 0, 0, ''],
    ['inputc', 0, 3, 1, 0, WC], ['numbold', 1, 9, 1, 1, '<alignment vertical="top"/>'], ['plaindate', 0, 0, 0, 14, ''], ['noteline', 5, 0, 0, 0, ''],
  ];
  const SID = Object.fromEntries(STYLES.map((s, i) => [s[0], i]));
  // Writes the list of styles in the XML format Excel expects (styles.xml).
  const stylesXml = () => '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    `<fonts count="${FONTS.length}">${FONTS.join('')}</fonts>` +
    `<fills count="${FILLS.length}">${FILLS.map(f => f.length < 8 ? `<fill><patternFill patternType="${f}"/></fill>` : `<fill><patternFill patternType="solid"><fgColor rgb="${f}"/><bgColor indexed="64"/></patternFill></fill>`).join('')}</fills>` +
    '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    `<cellXfs count="${STYLES.length}">${STYLES.map(([, f, fi, b, nf, al]) => `<xf numFmtId="${nf}" fontId="${f}" fillId="${fi}" borderId="${b}" xfId="0"${f ? ' applyFont="1"' : ''}${fi ? ' applyFill="1"' : ''}${b ? ' applyBorder="1"' : ''}${nf ? ' applyNumberFormat="1"' : ''}${al ? ' applyAlignment="1">' + al + '</xf>' : '/>'}`).join('')}</cellXfs>` +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  // writeBook creates a complete workbook. For every sheet it writes: column widths, frozen
  // header rows, all cells (text, numbers, dates, formulas), merged cells, auto-filter, dropdown
  // lists (data validation) and print settings (landscape, fit to page width).
  // Low-level writer. sheets: [{ name, rows: [[cell]], widths?: [n], merges?: ['A1:D1'], freeze?: 'A2',
  //   filter?: 'A1:F9', validations?: [{ sqref, list: [..] }], landscape?: bool, tab?: 'FF1F4E79' }]
  // cell: value | { v, s: styleName, f: formula }. Dates: pass { v: Date|ISO string, s: 'date' }.
  function writeBook(sheets) {
    const files = [];
    const add = (name, s) => files.push({ name, data: enc.encode(s) });
    add('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>');
    add('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');

<script>/* engine.js - ITGC testing logic. No user-interface code here, so the same

//   4. Value helpers       – small tools to read dates and user IDs written in many formats
//   5. Mapping             – connects the columns of YOUR files to the fields the rules need
//   6. Data checks         – completeness and accuracy (C&A) checks on the evidence (IPE)
//   7. Text checks         – judges free text (e.g. "UAT passed") with keywords or an AI model
//   8. Control tests       – the actual test of every item, attribute by attribute
//   9. Evaluation          – thesis metrics: precision, recall, F1, Cohen's kappa
//  10. Fingerprint         – SHA-256 "fingerprint" of each file for the run log
// Reading tips: "const x = ..." gives a name to something; "function name(...)" or
// "name => ..." is a small procedure; text after // is a comment for humans only.

  // Makes an independent copy of the settings, so changing the copy does not change the original.
  const clone = o => JSON.parse(JSON.stringify(o));

  // ===== 4. Value helpers =====
  // Value helpers: real exports write the same thing in many ways. These small tools make
  // values comparable. "blank" = the cell is empty (or only spaces).
  const blank = v => v === null || v === undefined || String(v).replace(/ /g, ' ').trim() === '';
  // IDs: trimmed; "Name Surname (USERID)" -> USERID; numbers kept as text without ".0"

  // name like "Ilze Vitola (IVITOLA)" it keeps only the ID in brackets: "IVITOLA".
  const id = v => {
    if (blank(v)) return null;
    let s = String(v).replace(/ /g, ' ').trim();

  };

  // leading zeros (job count "00000712" = "712", because Excel often drops the zeros).
  const normId = v => { const s = id(v); return s === null ? null : (/^\d+$/.test(s) ? s.replace(/^0+(?=\d)/, '') : s.toUpperCase()); };
  // Month names, so that dates like "07-Nov-2025" or "Dec 31, 2025" can be read.
  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12, january: 1, february: 2, march: 3, april: 4, june: 6, july: 7, august: 8, september: 9, october: 10, november: 11, december: 12 };
  // SAP writes an empty date as 00000000 or 00.00.0000 – such values mean "no date".
  const NULL_DATE = /^0{4}-?0{2}-?0{2}|^0{2}[./]0{2}[./]0{4}|^0{8}/;
  // returns milliseconds (UTC) or null. order: 'DMY' or 'MDY' for ambiguous dd/mm/yyyy dates
  // Reads a date written in any common format and converts it to one internal number
  // (milliseconds since 1970, the usual way computers store time). Returns nothing (null) if the
  // value is not a valid date. It tries the formats one after the other:
  function parseDate(v, order = 'DMY') {
    if (blank(v)) return null;
    // Already a date (Excel date cell) – use it as it is.
    if (v instanceof Date) return isNaN(v) ? null : v.getTime();
    // A number: either an Excel date serial number (days since 1900) or SAP style 20251231.
    if (typeof v === 'number') return v > 20000 && v < 80000 ? Math.round((v - 25569) * 86400000) : (v >= 19000101 && v <= 99991231 ? parseDate(String(v)) : null);
    const s = String(v).replace(/ /g, ' ').trim();
    // SAP "empty date" → no date.
    if (NULL_DATE.test(s)) return null;
    // Helper: reads the time part (hours, minutes, seconds, AM/PM).
    const time = (h, mi, se, ap) => { let H = +(h || 0); if (ap) { ap = ap.toUpperCase(); if (ap === 'PM' && H < 12) H += 12; if (ap === 'AM' && H === 12) H = 0; } return [H, +(mi || 0), +(se || 0)]; };
    // Helper: builds the date and rejects impossible ones (e.g. 31.02.2025). Two-digit years mean 20xx.
    const ok = (y, mo, d, t = [0, 0, 0]) => { if (y < 100) y += 2000; if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 1900) return null; const ms = Date.UTC(y, mo - 1, d, ...t); return new Date(ms).getUTCDate() === d ? ms : null; };

    let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.\d+)?\s*(AM|PM)?)?\s*(Z|[+-]\d{2}:?\d{2})?$/i);
    if (m) { const ms = ok(+m[1], +m[2], +m[3], time(m[4], m[5], m[6], m[7])); if (ms === null || !m[8] || /^z$/i.test(m[8])) return ms; const z = m[8].replace(':', ''); return ms - (z[0] === '-' ? -1 : 1) * (+z.slice(1, 3) * 60 + +z.slice(3, 5)) * 60000; }

    // (03/04/2025) the "order" setting decides whether it is 3 April or 4 March.
    m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2}|\d{4})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?)?$/i);
    if (m) { const [a, b] = [+m[1], +m[2]]; const dmy = order === 'MDY' ? (b > 12 && a <= 12 ? false : a > 12 ? true : false) : !(b > 12 && a <= 12); return dmy ? ok(+m[3], b, a, time(m[4], m[5], m[6], m[7])) : ok(+m[3], a, b, time(m[4], m[5], m[6], m[7])); }

    m = s.match(/^(\d{4})(\d{2})(\d{2})(?:\s*(\d{2}):?(\d{2}):?(\d{2}))?$/); // YYYYMMDD [HHMMSS] (SAP raw)

    m = s.match(/^(\d{1,2})[-\s.]([A-Za-z]{3,9})\.?[-\s.,]+(\d{2,4})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?)?$/); // 31-Dec-2025
    if (m && MONTHS[m[2].toLowerCase()]) return ok(+m[3], MONTHS[m[2].toLowerCase()], +m[1], time(m[4], m[5], m[6], m[7]));
    // Format 5: month name first – Dec 31, 2025.
    m = s.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?)?$/); // Dec 31, 2025
    if (m && MONTHS[m[1].toLowerCase()]) return ok(+m[3], MONTHS[m[1].toLowerCase()], +m[2], time(m[4], m[5], m[6], m[7]));

    return null;
